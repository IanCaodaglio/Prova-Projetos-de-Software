spring.application.name=tarefas

# Nada sensível aqui: tudo vem de variáveis de ambiente.
# Na EC2 elas são passadas com -e no docker run (ver .github/workflows/deploy.yml),
# que por sua vez lê os valores dos Secrets do GitHub.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cursosdb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
