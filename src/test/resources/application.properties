# Este arquivo SUBSTITUI o de src/main/resources durante os testes.
# Banco H2 em memória: o pipeline de testes roda sem Postgres e sem secrets.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
