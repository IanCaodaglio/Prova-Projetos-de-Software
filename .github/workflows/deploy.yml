# Pipeline de DEPLOY: roda a cada push/merge na main.
# 1) testa  2) gera o .jar  3) build + push da imagem no DockerHub
# 4) entra na EC2 via SSH e recria o container.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN,
#   EC2_HOST, EC2_SSH_KEY,
#   DB_HOST, DB_NAME, DB_USER, DB_PASSWORD
name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cursos-api   # <- troque "cursos-api" se quiser
  CONTAINER: cursos-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify = testes + cobertura + gera target/app.jar
      - name: Build with Maven
        run: mvn -B verify

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # linux/amd64: é a arquitetura da EC2 (evita "exec format error")
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy na EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker network inspect rede >/dev/null 2>&1 || docker network create -d bridge rede
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f ${{ env.CONTAINER }} || true
            docker run -d --name ${{ env.CONTAINER }} \
              --network rede \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DB_HOST='${{ secrets.DB_HOST }}' \
              -e DB_PORT=5432 \
              -e DB_NAME='${{ secrets.DB_NAME }}' \
              -e DB_USER='${{ secrets.DB_USER }}' \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              ${{ env.IMAGE }}:${{ github.sha }}
            docker image prune -af || true
