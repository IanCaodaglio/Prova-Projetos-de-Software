# Pipeline de TESTES: roda em todo Pull Request para a main.
# `mvn verify` executa testes de unidade + integração e o JaCoCo check
# (falha se o Service não tiver 100% de cobertura).
name: Testes

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Testes + cobertura
        run: mvn -B verify

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco
